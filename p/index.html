    function tout(oui) { cases.forEach(function (c) { c.checked = oui; }); maj(); }
    var rang = cmaDiv("cmrang"); rang.appendChild(cmaBtn("Tout sélectionner", "pri", function () { tout(true); })); rang.appendChild(cmaBtn("Tout désélectionner", "", function () { tout(false); })); w.appendChild(rang);
    var groupes = cat.groupes || []; if (groupes.length) { var rg = cmaDiv("cmrang"); groupes.forEach(function (gr) { rg.appendChild(cmaBtn("Groupe : " + gr.nom, "", function () { var set = {}; (gr.membres || []).forEach(function (m) { set[m] = 1; }); cases.forEach(function (c) { c.checked = !!set[c.value]; }); maj(); })); }); w.appendChild(rg); }
    var sites = (cat.sites || []); if (sites.length) { var rs = cmaDiv("cmrang"); sites.forEach(function (s) { rs.appendChild(cmaBtn("Site : " + s, "", function () { cases.forEach(function (c, i) { c.checked = (agents[i].site || "") === s; }); maj(); })); }); w.appendChild(rs); }
    w.appendChild(nb); w.appendChild(liste); maj();

      if (!ids.length) { res.className = "cmres ko"; res.textContent = "Choisissez au moins un agent (ou « Tout sélectionner »)."; return; }

      if (!window.confirm("Envoyer cette information à " + (tous ? "tous les agents (" + ids.length + ")" : ids.length + " agent" + (ids.length > 1 ? "s" : "")) + " ?")) return;

      var o = { action: "publier", categorie: type.value, titre: titre.value.trim(), message: msg.value.trim(), priorite: prio.value, dateEv: date.value, heureDeb: hd.value, heureFin: hf.value, site: site.value.trim(), etage: etage.value.trim(), lieu: lieuFinal(), destinataires: tous ? "tous" : ids, accuse: acc.checked, participation: par.checked };
      cmaAppel("cmAdminSauve", [CMENV.tok, o], function (r) {
        env.disabled = false;
        if (r && r.ok) { res.className = "cmres ok"; res.textContent = (r.msg || "Information envoyée.") + " (" + (tous ? "tous les agents" : ids.length + " agent" + (ids.length > 1 ? "s" : "")) + ")"; titre.value = msg.value = etage.value = lieu.value = date.value = hd.value = hf.value = ""; acc.checked = par.checked = false; tout(false); if (typeof cmaCompteur === "function") cmaCompteur(); }
        else if (r && /refus/i.test(r.msg || "")) { CMENV.tok = ""; connexion(); w.appendChild(cmaDiv("cmres ko", "Session expirée : saisissez de nouveau votre mot de passe.")); }
        else { res.className = "cmres ko"; res.textContent = (r && r.msg) || "L’envoi a échoué."; }
      }, function () { env.disabled = false; res.className = "cmres ko"; res.textContent = "Connexion interrompue : vérifiez dans Information si l’envoi est parti avant de recommencer."; });
    };
  }
  if (CMENV.tok && CMENV.cat) formulaire(); else if (CMENV.tok) chargeCat(); else connexion();
}

/* IRIS — message de bienvenue / de remerciement et voix après chaque pointage (ajout isolé : l'écran de confirmation existant n'est pas modifié).
   Appelé par la confirmation « Pointé » (arrivée, départ ou pointage déjà enregistré), que l'agent ait scanné avec l'appareil photo du téléphone ou avec la caméra de son espace.
   Réutilise : el, c, IrisVoix (voix du téléphone, ou voix naturelle quand elle est activée). */
// Moment de la journée (heure de Paris donnée par le serveur) : matin 4 h–12 h, après-midi 12 h–18 h, soir 18 h–24 h, nuit 0 h–4 h
// Coucher du soleil à Paris (heure légale, été/hiver pris en compte) : le « soir » commence au coucher du soleil, au plus tard à 18 h
function pvDecalage(d) { try { var p = Number(new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Paris", hour: "2-digit", hour12: false }).format(d)) % 24, o = p - d.getUTCHours(); if (o < 0) o += 24; return o > 12 ? o - 24 : o; } catch (e) { return 1; } }
function pvCoucher(d) {
  d = d || new Date(); var N = Math.floor((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(d.getFullYear(), 0, 0)) / 864e5), R = Math.PI / 180, lat = 48.8566 * R, dec = 23.44 * R * Math.sin(2 * Math.PI * (284 + N) / 365), B = 2 * Math.PI * (N - 81) / 364, eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B), cc = (Math.sin(-0.833 * R) - Math.sin(lat) * Math.sin(dec)) / (Math.cos(lat) * Math.cos(dec));
  return 12 - 2.3522 / 15 - eot / 60 + Math.acos(Math.max(-1, Math.min(1, cc))) / R / 15 + pvDecalage(d);
}
// h = heure décimale de Paris (ex. 17,38) : matin 4 h–12 h, après-midi 12 h–coucher du soleil, soir coucher–24 h, nuit 0 h–4 h
function pvMoment(h) { var s = Math.min(pvCoucher(), 18); return h >= 4 && h < 12 ? "matin" : h >= 12 && h < s ? "apres" : h >= s ? "soir" : "nuit"; }
function pvMessage(r) {
  var hh = /^\d{1,2}:/.test(String(r.heure || "")) ? (Number(String(r.heure).split(":")[0]) + Number(String(r.heure).split(":")[1] || 0) / 60) : (new Date().getHours() + new Date().getMinutes() / 60), m = pvMoment(hh), salut = (m === "matin" || m === "apres") ? "Bonjour" : "Bonsoir", p = String(r.prenom || "").trim(), tete = salut + (p ? " " + p : "") + ". ";
  var dep = r.type === "Départ" || /^départ/i.test(String(r.libelle || ""));
  if (/déjà/i.test(String(r.libelle || ""))) return tete + (dep ? "Votre départ" : "Votre arrivée") + " est déjà enregistré" + (dep ? "" : "e") + ". Merci.";
  if (dep) return tete + "Votre départ a bien été pris en compte. Merci et bonne route. " + { matin: "Bonne journée.", apres: "Bon après-midi.", soir: "Bonne soirée.", nuit: "Bonne nuit." }[m] + " IRIS vous remercie pour votre confiance.";
  return tete + "Bienvenue ! Votre arrivée a bien été prise en compte. " + { matin: "Merci et bonne journée.", apres: "Merci et bon après-midi.", soir: "Merci et bonne soirée.", nuit: "Merci et bon courage pour cette nuit." }[m];
}
// iPhone/iPad : la voix automatique n'est autorisée qu'après un premier geste de l'utilisateur. Dès le premier toucher de la page (bouton « Pointage », « Pointer »…), on déverrouille la synthèse vocale en silence.
var PV = { ok: false };
function pvDeverrouille() {
  if (PV.ok) return; PV.ok = true;
  try { if (window.speechSynthesis && window.SpeechSynthesisUtterance) { var u = new SpeechSynthesisUtterance(" "); u.volume = 0; window.speechSynthesis.speak(u); } } catch (e) { }
}
["touchstart", "click", "keydown"].forEach(function (n) { document.addEventListener(n, pvDeverrouille, { passive: true, capture: true }); });
function pointageVoix(r) {
  var t = pvMessage(r), d = el("div", "pvm", t);
  d.style.cssText = "margin:14px 4px 6px;font-size:19px;line-height:1.4;font-weight:600;text-align:center";
  c.appendChild(d);
  var v = null; try { v = typeof IrisVoix !== "undefined" ? IrisVoix : null; } catch (e) { }
  if (!v || !v.lire) return;
  var b = el("button", "sec", "Écouter le message"); b.type = "button"; b.onclick = function () { try { v.lire(t, null, "pv"); } catch (e) { } };
  c.appendChild(b);
  try { v.lire(t, null, "pv"); } catch (e) { }   // lecture automatique (sur iPhone, Apple peut l'interdire : le bouton « Écouter le message » reste disponible)
}

/* ---- Départ avant l'heure prévue : avertissement (message + voix) avec possibilité de valider quand même ----
   Le serveur joint « dep » ({reste: minutes, fin: "hh:mm"}) à la réponse du scan quand le prochain pointage serait un départ avant la fin de service. */
var DEPINFO = null;
function pvDuree(min, voix) {
  var h = Math.floor(min / 60), m = min % 60;
  if (h <= 0) return m + " minute" + (m > 1 ? "s" : "");
  return voix ? h + (h > 1 ? " heures" : " heure") + (m ? " " + m : "") : h + " h" + (m ? " " + ("0" + m).slice(-2) : "");
}

  var d = DEPINFO; if (!d || !(d.reste > 0)) return false;
  var aff = "Attention : il vous reste " + pvDuree(d.reste, false) + " de service avant l’heure prévue (" + d.fin + "). Pour valider votre départ maintenant, appuyez sur « Pointer ».";
  var dit = "Attention. Il vous reste " + pvDuree(d.reste, true) + " de service avant l’heure prévue de fin. Pour valider votre départ maintenant, appuyez sur Pointer.";
  var e = el("div", "pvw", aff); e.setAttribute("role", "alert");
  e.style.cssText = "margin:12px 4px;padding:12px 14px;border-radius:14px;background:#fff0d6;color:#7a4a00;border:1px solid #e0a64a;font-size:18px;line-height:1.4;font-weight:600;text-align:center";
  c.appendChild(e);

  return true;
}
