html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#07121f;overscroll-behavior:none;touch-action:none;-webkit-touch-callout:none}
body{position:fixed;top:0;left:0;right:0;bottom:0}
.flip>*+*{margin-left:.16em}.flip{display:flex;align-items:flex-end;font-family:"Helvetica Neue",Arial,sans-serif;font-weight:700;line-height:1}.flip.xl{font-size:8.5vw;font-size:clamp(56px,8.5vw,150px)}
.cd{position:relative;width:1.42em;height:1.7em;perspective:700px;filter:drop-shadow(0 .05em .09em rgba(0,0,0,.5))}.cd .h{position:absolute;left:0;right:0;height:50%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}.cd .t{top:0;border-radius:.1em .1em 0 0;background:linear-gradient(180deg,#1a2f46,#0f1f31)}.cd .b{bottom:0;border-radius:0 0 .1em .1em;background:linear-gradient(180deg,#0b1724,#13273b)}.cd .h i{position:absolute;left:0;right:0;height:1.7em;line-height:1.7em;text-align:center;font-style:normal;color:#f3ecdb;font-variant-numeric:tabular-nums}.cd .t i{top:0}.cd .b i{bottom:0}.cd .ft{transform-origin:bottom;z-index:3}.cd .fb{transform-origin:top;z-index:2;transform:rotateX(90deg)}.cd.go .ft{animation:ftop .28s ease-in forwards}.cd.go .fb{animation:fbot .28s .28s ease-out forwards}@keyframes ftop{to{transform:rotateX(-90deg)}}@keyframes fbot{to{transform:rotateX(0)}}
.mt>*+*{margin-left:14px}.mt{display:flex;align-items:center;color:#f3ecdb;min-height:64px}.mt svg{width:66px;height:66px;flex:none}.mt .tp{font-size:46px;font-weight:700;line-height:1}.mt .tx2{display:flex;flex-direction:column;text-align:left;font-size:15px;line-height:1.35}.mt .tx2 b{font-weight:600;font-size:17px}.mt .tx2 span{opacity:.75}
.mt.xl svg{width:8vw;width:clamp(70px,8vw,110px);height:8vw;height:clamp(70px,8vw,110px)}.mt.xl .tp{font-size:5.6vw;font-size:clamp(50px,5.6vw,84px)}.mt.xl .tx2{font-size:1.5vw;font-size:clamp(15px,1.5vw,22px)}.mt.xl .tx2 b{font-size:1.7vw;font-size:clamp(17px,1.7vw,26px)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;background:radial-gradient(1200px 700px at 12% 6%,rgba(212,175,55,.16),transparent 60%),radial-gradient(900px 700px at 100% 100%,rgba(63,111,168,.25),transparent 60%),linear-gradient(160deg,#07121f,#0f2640)}
.pg>*+*{margin-top:3.4vh}.pg{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2.6vh 4vw;box-sizing:border-box}
.top{display:flex;justify-content:space-around;display:grid;grid-template-columns:1fr 1fr;align-items:center;justify-items:center;width:100%}
.gc>*+*{margin-top:2.2vh}.gc{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.rw{display:flex;justify-content:space-around;display:grid;grid-template-columns:1fr 1fr;align-items:center;justify-items:center;width:100%}
.rr{display:flex;align-items:center;justify-content:center}.rr>*+*{margin-left:2.6vw}
.rr .mt.xl svg{width:5.6vw;width:clamp(54px,5.6vw,86px);height:5.6vw;height:clamp(54px,5.6vw,86px)}.rr .mt.xl .tp{font-size:4.4vw;font-size:clamp(40px,4.4vw,68px)}.rr .mt.xl .tx2,.rr .cpt span{white-space:nowrap}.rr .mt.xl .tx2{font-size:1.25vw;font-size:clamp(13px,1.25vw,20px)}.rr .mt.xl .tx2 b{font-size:1.45vw;font-size:clamp(15px,1.45vw,23px)}
.lg{height:90px;height:clamp(90px,19vh,190px);width:auto;filter:drop-shadow(0 8px 30px rgba(0,0,0,.35))}
h1{font-size:3.7vw;font-size:clamp(28px,3.7vw,60px);margin:0;font-weight:600;letter-spacing:-.025em;color:#fff}
h1 em{font-style:normal;background:linear-gradient(180deg,#f1d58a,#c9973f 55%,#a87a2e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.fil{width:70px;height:2px;border-radius:2px;background:#c9973f;opacity:.85}
.s{font-size:1.35vw;font-size:clamp(13px,1.35vw,21px);color:#cdb88a;letter-spacing:.16em;text-transform:uppercase}
.k{background:#fff;border-radius:3.2vw;border-radius:clamp(30px,3.2vw,52px);padding:2vw;padding:clamp(16px,2vw,32px);box-shadow:0 0 0 1px rgba(212,175,55,.5),0 40px 100px rgba(0,0,0,.55);line-height:0}
#qr{position:relative}.lq{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);-webkit-transform:translate(-50%,-50%);background:#0b1a2b;border-radius:24%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 5px #fff}.lq img{height:78%;width:auto}
.flip.xl{font-size:7.4vw;font-size:clamp(44px,min(7.4vw,17vh),140px)}
.cpt>*+*{margin-left:14px}.cpt{display:flex;align-items:center;color:#d9b15f;font-size:1.25vw;font-size:clamp(13px,1.25vw,20px);letter-spacing:.06em}
#cd{width:5.6vw;width:clamp(60px,5.6vw,92px);height:5.6vw;height:clamp(60px,5.6vw,92px);border-radius:50%;border:2px solid #c9973f;font-size:3vw;font-size:clamp(28px,3vw,46px);font-weight:600;display:flex;align-items:center;justify-content:center;margin:0;color:#e3bb6a}
@media (orientation:portrait){.pg{justify-content:flex-start;padding-top:4vh}.top,.rw{display:flex;flex-direction:column;align-items:center}.top>*+*,.rw>*+*{margin-top:2.4vh}.rr{flex-wrap:wrap}.rr>*,.rr>*+*{margin:1.2vh 2vw}.lg{height:80px;height:clamp(80px,13vh,150px)}}
.msg{display:none;position:fixed;left:0;right:0;bottom:4vh;text-align:center;font-size:18px;color:#cdb88a;padding:0 24px;letter-spacing:.04em}

    else if (k === "n") g = nuage;
    else if (k === "p") g = nuage + '<g stroke="#7fb6e8" stroke-width="3" stroke-linecap="round"><line x1="24" y1="51" x2="21" y2="58"/><line x1="33" y1="51" x2="30" y2="58"/><line x1="42" y1="51" x2="39" y2="58"/></g>';
    else if (k === "w") g = nuage + '<g fill="#ffffff"><circle cx="24" cy="54" r="2.6"/><circle cx="33" cy="58" r="2.6"/><circle cx="42" cy="54" r="2.6"/></g>';
    else if (k === "o") g = nuage + '<polygon points="34,44 26,56 32,56 29,64 40,50 34,50" fill="#f2c94c"/>';
    else g = '<g stroke="#e6edf5" stroke-width="4" stroke-linecap="round"><line x1="14" y1="26" x2="50" y2="26"/><line x1="10" y1="36" x2="54" y2="36"/><line x1="16" y1="46" x2="48" y2="46"/></g>';
    return '<svg viewBox="0 0 64 64" aria-hidden="true">' + g + '</svg>';
  }
  function rend(d) {
    var c = d.current, m = D[c.weather_code] || ["Météo", "n"], jour = c.is_day === 1, lib = m[0];
    if (!jour && m[1] === "s") lib = c.weather_code === 0 ? "Nuit dégagée" : "Nuit plutôt dégagée";
    el.innerHTML = ico(m[1], jour) + '<div class="tp">' + Math.round(c.temperature_2m) + '°</div><div class="tx2"><b>' + lib + '</b><span>Paris La Défense</span><span>' + Math.round(d.daily.temperature_2m_min[0]) + '° / ' + Math.round(d.daily.temperature_2m_max[0]) + '°</span></div>';
  }
  function garde(d) { try { localStorage.setItem("iris_meteo", JSON.stringify(d)); } catch (e) {} }
  function direct() {
    var x = new XMLHttpRequest();
    x.open("GET", "https://api.open-meteo.com/v1/forecast?latitude=48.892&longitude=2.236&current=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min&timezone=Europe%2FParis&forecast_days=1");
    x.onload = function () { try { var d = JSON.parse(x.responseText); rend(d); garde(d); } catch (e) {} };
    x.send();
  }
  function go() {
    try {
      google.script.run.withSuccessHandler(function (d) { if (d && d.current) { rend(d); garde(d); } else direct(); }).withFailureHandler(direct).meteoDonnees();
    } catch (e) { direct(); }
  }
  /* Dernière météo connue affichée tout de suite ; message d'attente si rien n'est disponible. */
  try { var memo = localStorage.getItem("iris_meteo"); if (memo) rend(JSON.parse(memo)); } catch (e) {}
  setTimeout(function () { if (!el.innerHTML) el.innerHTML = '<div class="tx2"><b>Météo</b><span>Paris La Défense</span><span>en attente de connexion</span></div>'; }, 15000);
  go(); setInterval(go, 600000); setTimeout(go, 30000);
})();
</script>
